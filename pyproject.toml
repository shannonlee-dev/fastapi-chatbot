[project]
name = "fastapi-chatbot"
version = "0.1.0"
description = "FastAPI 기반 사용자별 AI 챗봇"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "itsdangerous",
    "pydantic-settings",
    "uvicorn",
    "jinja2",
    "sqlalchemy",
    "openai",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "httpx2>=2.9.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
markers = ["smoke: 외부 서비스·실제 데이터 변경 없이 주요 실행 경로 검증"]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
strict = [
    "src/chatbot/chat/context.py",
    "src/chatbot/chat/openai_client.py",
    "src/chatbot/chat/service.py",
    "tests/chat/test_context.py",
    "tests/chat/test_openai_client.py",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
