name: 문서와 Application 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - name: 잠금 파일로 Dependency 설치
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: 문서와 Code 검사
        run: |
          uv run --frozen python scripts/check_docs.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pyright
      - name: 전체 pytest suite
        run: uv run --frozen pytest
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen --python 3.13
      - run: npm ci --ignore-scripts
      - name: 실제 화면의 DOM 동작 검사
        run: npm run test:ui
